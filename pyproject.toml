[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bayesrays-2d-vlbi"
version = "0.1.0"
description = "Research code for uncertainty quantification in neural VLBI imaging."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ehtim",
    "flax",
    "jax",
    "matplotlib",
    "numpy",
    "optax",
    "pyyaml",
    "scikit-image",
    "tqdm",
]

[project.optional-dependencies]
image-examples = [
    "imageio",
    "pillow",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]
notebooks = [
    "ipykernel",
    "jupyterlab",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
