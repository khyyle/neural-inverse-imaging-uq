[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bayesrays-2d-vlbi"
version = "0.1.0"
description = "Research code for uncertainty quantification in neural VLBI imaging."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ehtim @ git+https://github.com/achael/eht-imaging.git@9d29103abb8c343b566c4522f60da7b792fb5934",
    "finufft==2.5.1",
    "flax==0.12.9",
    "jax==0.11.1",
    "laplax==0.0.2",
    "matplotlib==3.11.2",
    "numpy==2.5.3",
    "optax==0.2.8",
    "paramsurvey==0.4.21",
    "scikit-image==0.26.0",
    "scipy==1.18.1",
    "tqdm==4.70.1",
]

[project.optional-dependencies]
image-examples = [
    "imageio==2.37.4",
    "pillow==12.3.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.7",
]
notebooks = [
    "ipykernel==7.3.0",
    "jupyterlab==4.6.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
